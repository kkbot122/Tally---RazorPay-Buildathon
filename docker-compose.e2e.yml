services:
  postgres-e2e:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tally_e2e
      POSTGRES_USER: tally
      POSTGRES_PASSWORD: tally
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tally -d tally_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - tally-e2e-data:/var/lib/postgresql/data

volumes:
  tally-e2e-data:
